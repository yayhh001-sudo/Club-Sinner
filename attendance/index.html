<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10080b"><title>출근 현황 | CLUB SINNER</title><link rel="stylesheet" href="/styles.css"></head><body data-page="attendance"><header class="topbar"><a class="brand" href="/" aria-label="CLUB SINNER 홈"><img class="brand-logo" src="/sinner-logo.jpg" alt="Sinner 로고"><span class="brand-word">CLUB SINNER<small>프라이빗 호스트 클럽</small></span></a><nav aria-label="메인 메뉴"><a href="/">홈</a><a href="/hosts/">호스트 소개</a><a href="/ranking/">랭킹</a><a href="/attendance/" class="active" aria-current="page">출근 현황</a><a href="/lounge/">라운지</a><a href="/admin/">관리자</a></nav></header><main><section class="section" id="attendance">

      <section class="stamp-shell"><p class="stamp-intro">호스트의 이름을 선택하면 월별 출근 도장판을 확인할 수 있습니다. 출근 시간과 상세 내역은 관리자에게만 공개됩니다.</p><div id="stamp-hosts" class="stamp-hosts"></div><div id="stamp-panel" hidden><button type="button" id="stamp-back" class="stamp-back">← 호스트 목록</button><h3 id="stamp-host-name"></h3><div class="stamp-month"><button id="stamp-prev" type="button" aria-label="이전 달">‹</button><strong id="stamp-month-label"></strong><button id="stamp-next" type="button" aria-label="다음 달">›</button></div><div id="stamp-grid" class="stamp-grid"></div><p id="stamp-count"></p></div><p id="stamp-message" role="status"></p></section><section class="attendance-self"><h3>호스트 출퇴근 기록</h3><p>본인 출근 비밀번호로 로그인하면 출근 도장을 찍을 수 있습니다.</p><form id="host-login"><select id="host-choice" required><option value="">호스트 선택</option></select><input id="host-password" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" title="숫자 4자리를 입력하세요" required placeholder="숫자 4자리 출근 비밀번호" autocomplete="current-password"><button type="submit">호스트 로그인</button></form><div id="host-controls" hidden><p id="host-greeting"></p><button id="clock-in" type="button">출근하기</button> <button id="clock-out" type="button">퇴근하기</button> <button id="host-logout" type="button">로그아웃</button></div><p id="host-feedback" role="status"></p></section><style>.stamp-shell,.attendance-self{max-width:850px;margin:22px auto;padding:26px;border:1px solid #68343f;border-radius:12px;background:#160d11;color:#f4e9e8}.stamp-intro{color:#c8a9b2}.stamp-hosts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stamp-hosts button,.stamp-back,.stamp-month button,.attendance-self button{background:#391923;color:#f4e9e8;border:1px solid #86505f;border-radius:7px;padding:12px;cursor:pointer}.stamp-hosts button{text-align:left;font-size:1.1rem}.stamp-month{display:flex;align-items:center;justify-content:space-between;max-width:400px;margin:22px auto}.stamp-month strong{font-size:1.3rem}.stamp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:700px;margin:auto}.stamp-day{aspect-ratio:1;min-height:44px;background:#21141a;border:1px solid #50303b;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem}.stamp-day.stamped{border-color:#b15a71;background:#3c1926}.stamp-seal{font-weight:800;color:#e2a3b2;font-size:clamp(.65rem,2vw,1.05rem);transform:rotate(-13deg);border:2px solid #bd667b;border-radius:50%;padding:3px}.stamp-weekday{text-align:center;color:#b997a1;padding:8px}.attendance-self form{display:grid;gap:12px}.attendance-self input,.attendance-self select{width:100%;padding:12px;background:#24151b;color:white;border:1px solid #77515a;border-radius:6px}.attendance-self #host-feedback,#stamp-message{color:#e9b7c4}</style><script src="/attendance/stamp-calendar.js" defer></script><script src="/attendance/host-attendance.js" defer></script><div id="attendance-list" class="attendance-list"><div class="loading">출근부를 불러오는 중…</div></div>
